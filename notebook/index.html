  <title>Four levers for better AI code review</title>
  <script id="1" type="text/markdown">
    # Four levers for better AI code review, tested on real bugs

    Claude already catches bugs in code review. The useful question is **what makes it catch more, with less noise**.
    I tested four levers: what the reviewer reads, how much context it gets, how its confidence is used, and how
    often it reviews.

    The test set is 47 real changes from `angular/angular` and `django/django` that a later fix explicitly blamed
    for a bug, plus 19 clean changes as controls. That's 404 reviews by `claude-sonnet-5-5`, graded by an
    independent model judge and cross-checked by a second one (87/87 agreement on the original set).

    | lever | what helped | what didn't |
    |---|---|---|
    | What it reads first | diff before description: avoids being talked out of a real concern | the description itself: 54% vs 52% on average |
    | How much context | — | whole files: more confidence and more false alarms, no extra bugs |
    | How confidence is used | ≥ 0.8 as a high-precision tier: 0 false alarms | treating every finding the same |
    | How often it reviews | merging 4 independent passes: 54% → 63% of bugs | a single pass |

    Code, data, prompts and every verdict: [github.com/fabianrios/pr-review-ai-effectivity](https://github.com/fabianrios/pr-review-ai-effectivity).

  <script id="4" type="module">
    // 95% Wilson interval for k successes out of n
    const wilson = (k, n, z = 1.96) => {
      const p = k / n, d = 1 + z * z / n;
      const c = (p + z * z / (2 * n)) / d;
      const h = (z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))) / d;
      return [Math.max(0, c - h), Math.min(1, c + h)];
    };
  </script>
  <script id="5" type="text/markdown">
    ## Lever 1: what the reviewer reads first

    Does the PR description help the reviewer, or steer it? On the first 10 Angular cases, adding the title and
    description **lowered** detection from 60% to 40%, in every one of 4 repeated samples. On 27 new cases picked the
    same way, the gap vanished: 54% vs 52%. **On average, the description neither helps nor hurts.** Each dot is a
    detection rate over all reviews in that set; the bar is its 95% interval.
  </script>
  <script id="6" type="module">
    const replication = [
      {set: "First 10 cases", condition: "A", k: 24, n: 40},
      {set: "First 10 cases", condition: "B", k: 16, n: 40},
      {set: "27 new cases", condition: "A", k: 58, n: 108},
      {set: "27 new cases", condition: "B", k: 56, n: 108}
    ].map(d => {
      const [lo, hi] = wilson(d.k, d.n);
      return {...d, rate: d.k / d.n, lo, hi, label: conditionNames[d.condition]};
    });
  </script>

  <script id="8" type="text/markdown">
    ### …but on some cases it anchors the reviewer

    Every bug case was reviewed 4 times with the diff only (**A**) and 4 times with the description (**B**). Where the
    two dots sit together, both conditions scored the same. Most cases don't move. Where they do, the clearest drops
    follow a **confident description**:

    - **bug-63485:** from the diff alone, the reviewer flags the `EmptyError` that `first()` throws, in 4 of 4 runs.
      When the description argues that the change is needed, it stays silent in 4 of 4.

    Cases also move the other way (B finds it, A doesn't), for example an API break that the description makes
    visible.

    **Improvement:** review the diff first, then read the description and check its claims against the code.
  </script>

  <script id="14" type="text/markdown">
    ## Levers 2 and 3: how much context, and how to use confidence

    This is the main run: 20 bug cases and 19 clean changes, one review each. Each line is a context condition. The
    lines show the share of bugs detected, and the share of clean changes falsely flagged, counting only findings at or
    above each confidence level.

    - **Whole files don't help.** C finds the same bugs as A and B. It raises the reviewer's confidence and its false
      alarms, and it was about three quarters of the cost. Context has to be **targeted** (callers, overrides, related
      queries), not dumped.
    - **Confidence works as tiers.** At ≥ 0.8 there are **no** false alarms, but only 10–25% of bugs reach that level.
      Most correct findings sit at 0.3–0.6. Surface ≥ 0.8 prominently and show the rest as "worth a look"; don't drop
      them.
  </script>
  <script id="15" type="module">
    const mainRun = (() => {
      const raw = {
        A: {detection: [13, 9, 5], false_alarm: [1, 1, 0]},
        B: {detection: [13, 9, 2], false_alarm: [2, 0, 0]},
        C: {detection: [13, 12, 4], false_alarm: [4, 1, 0]}
      };
      const thresholds = ["any", "≥ 0.5", "≥ 0.8"];
      return Object.entries(raw).flatMap(([condition, m]) =>
        Object.entries(m).flatMap(([metric, ks]) => ks.map((k, i) => {
          const n = metric === "detection" ? 20 : 19;
          const [lo, hi] = wilson(k, n);
          return {condition, metric: metric === "detection" ? "Bugs detected (of 20)" : "False alarms (of 19 clean changes)",
                  threshold: thresholds[i], k, n, rate: k / n, lo, hi};
        })));
    })();
  </script>

    })
  </script>
  <script id="17" type="text/markdown">
    ## Lever 4: how often it reviews

    Many bugs are caught in some runs and missed in others. On the 27 new cases (diff only), merging several
    independent reviews raises detection from 54% with one review to 63% with four. **If recall matters more than
    noise, run the review more than once and merge the findings.** The false-alarm cost of merging was not measured:
    the new set has no controls.
  </script>

  <script id="20" type="text/markdown">
    ## What I'd change in an AI review setup

    1. **Diff first, description second.** Tell the reviewer to verify the author's claims, not to accept them.
    2. **Targeted context, not whole files.**
    3. **Confidence tiers**: ≥ 0.8 is high precision, the rest is "worth a look".
    4. **Two or more passes** when a missed bug is expensive.
    5. **Treat flagged "clean" code seriously.** One flagged control turned out to be a real bug that Angular fixed
       months later.

    **About 30% of the bugs were never caught**, mostly because they need knowledge outside the diff (database cast
    semantics, inheritance, parser edge cases). That's the next experiment: does targeted context retrieval close
    that gap?

    **Limitations.** Small numbers (most intervals are ±20 points). Labels are checked by two models, not by
    maintainers. One reviewer model. Public code may be in the training data. Full write-up and data:
    [github.com/fabianrios/pr-review-ai-effectivity](https://github.com/fabianrios/pr-review-ai-effectivity).
