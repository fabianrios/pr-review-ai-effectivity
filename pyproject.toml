[project]
name = "review-bench"
version = "0.1.0"
description = "Benchmark: does Claude catch real bugs when reviewing angular/angular pull requests?"
readme = "README.md"
authors = [
    { name = "Fabian Rios", email = "hi@fabianrios.co" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
bench-mine = "review_bench.mine:main"
bench-cases = "review_bench.cases:main"
bench-controls = "review_bench.controls:main"
bench-checkpoint = "review_bench.checkpoint:main"
bench-mine-django = "review_bench.mine_django:main"
bench-mine-internal = "review_bench.mine_internal:main"
bench-eval = "review_bench.evaluate:main"
