    title: 'Fixed #33312 -- Raised explicit exception when copying deferred model
      instances.'
    body: "#### Trac ticket number\r\n<!-- Replace XXXXX with the corresponding Trac\
      \ ticket number, or delete the line and write \"N/A\" if this is a trivial PR.\
      \ -->\r\n\r\nticket-33312\r\n\r\n#### Branch description\r\n\r\nPreviously `save()`\
      \ would crash with an attempted forced update message, and both `save(force_insert=True)`\
      \ and `bulk_create()` would crash with `DoesNotExist` errors when trying to\
      \ retrieve a row with `pk IS NULL`.\r\n\r\nImplementing deferred field model\
      \ instance copying might be doable in certain cases (e.g. when all the deferred\
      \ fields are db generated) but that's not trivial to implement in a backward\
      \ compatible way.\r\n\r\nThanks @adamsol for the report and test.\r\n"
    labels: []
