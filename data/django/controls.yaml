  title: 'Fixed #29257 -- Caught DatabaseError when attempting to close a possibly
    already-closed cursor.'
  merged_at: '2025-11-25T23:49:56+05:30'
  matched_to: bdbda29c3e
  area: django/db
  changed_lines: 37
  tickets:
  - 29257
  pr:
    number: 20321
    url: https://github.com/django/django/pull/20321
    title: 'Fixed #29257 -- Caught DatabaseError when attempting to close a possibly
      already-closed cursor.'
    body: "#### Trac ticket number\r\n\r\nticket-29257\r\n\r\n#### Branch description\r\
      \nWhen ``cursor.execute()`` raises an exception and ``cursor.close()`` also\
      \ raises, Django used to surface the ``cursor.close()`` error, adding noise\
      \ to the original execution failure and producing misleading messages such as:\
      \ \"cursor _django_curs_xxx does not exist\".\r\n\r\nThis patch ensures that\
      \ the original ``execute()`` exception is preserved without unnecessary context.\
      \ A regression test is included to verify that ``cursor.close()`` errors do\
      \ not distract from the real underlying exception.\r\n\r\n\r\n#### Checklist\r\
      \n- [x] This PR targets the `main` branch. <!-- Backports will be evaluated\
      \ and done by mergers, when necessary. -->\r\n- [x] The commit message is written\
      \ in past tense, mentions the ticket number, and ends with a period.\r\n- [x]\
      \ I have checked the \"Has patch\" ticket flag in the Trac system.\r\n- [x]\
      \ I have added or updated relevant tests.\r\n- [ ] I have added or updated relevant\
      \ docs, including release notes if applicable.\r\n- [ ] I have attached screenshots\
      \ in both light and dark modes for any UI changes.\r\n"
    labels: []
- control: 34186e731ca20a2344b1f88fd543a854d6b13a00
  short: 34186e731c
  title: 'Fixed #36712 -- Evaluated type annotations lazily in template tag registration.'
  merged_at: '2025-11-29T18:45:39-05:00'
  matched_to: 1a9fba7a6c
  area: django/template
  changed_lines: 170
  tickets:
  - 36712
  pr:
    number: 20340
    url: https://github.com/django/django/pull/20340
    title: 'Fixed #36712 -- Evaluated type annotations lazily in template tag registration.'
    body: "#### Trac ticket number\r\nticket-36712\r\n\r\n#### Branch description\r\
      \nPython 3.14 introduces [deferred evaluation of type annotations](https://docs.python.org/3/whatsnew/3.14.html#whatsnew314-deferred-annotations),\
      \ which can make headaches around circular definitions go away.\r\n\r\n`inspect.getfullargspec`\
      \ wasn't updated to take the new `annotation_format` arg that was provided to\
      \ let inspecting libraries (us) avoid eagerly evaluating user annotations, see\
      \ https://github.com/python/cpython/issues/141560.\r\n\r\nOne solution would\
      \ have been to copy and paste the entire function--along with importing the\
      \ seven or eight other symbols it needed--and do the tweak, long-term forking\
      \ the implementation.\r\n\r\nInstead, patching the module helper anticipating\
      \ the change we want Python to make felt more future-proof and sufficiently\
      \ self-documenting. However, I'm happy to swap this out for a copy-and-paste\
      \ approach if that's preferable, but we'd want to redistribute the python license\
      \ in that case, I suppose?\r\n\r\nIdeally, this will be reverted when an upstream\
      \ solution is available for https://github.com/python/cpython/issues/141560.\r\
      \n\r\nThanks Patrick Rauscher for the report and Augusto Pontes for the first\
      \ iteration and test.\r\n\r\n#### Checklist\r\n- [x] This PR targets the `main`\
      \ branch. <!-- Backports will be evaluated and done by mergers, when necessary.\
      \ -->\r\n- [x] The commit message is written in past tense, mentions the ticket\
      \ number, and ends with a period.\r\n- [x] I have checked the \"Has patch\"\
      \ ticket flag in the Trac system.\r\n- [x] I have added or updated relevant\
      \ tests.\r\n- [x] I have added or updated relevant docs, including release notes\
      \ if applicable.\r\n- [x] I have attached screenshots in both light and dark\
      \ modes for any UI changes.\r\n"
    labels: []
