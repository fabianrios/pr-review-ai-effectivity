# Hand-verified Django bug cases. `culprit` is the commit named in a later "Regression in <sha>." fix.
#
# Inclusion rule (same as angular): the later fix explicitly attributes the bug to this commit, the faulty code is
# visibly present in this commit's diff, and the bug is a behavioral defect (not visual CSS, docs, or test infra).
# Selection preference: culprits merged 2024-01-01 or later; diverse areas.
# Ground truths were drafted by Claude Code from the cited fix commits and diffs; pending author confirmation.
# Trac ticket texts were not read (code.djangoproject.com is blocked in the mining environment).

bugs:
  - culprit: 31a43c571f4d036827d4fd7a5f615591637dc1be
    status: include
    fix_commit: a32c7075cf634aee1f4f3deecd27f194097ec0c2
    fix_tickets: [37017]
    bug_files: [django/contrib/auth/__init__.py]
    ground_truth: >
      To keep `request.auser()` in sync, the commit changes `alogin()` and `alogout()` to replace `request.auser`
      instead of setting `request.user`. It drops the old `if hasattr(request, "user"): request.user = user` and
      `request.user = AnonymousUser()` branches. After `await alogin(...)` or `await alogout(...)`,
      `request.user` still holds the previous user (e.g. still authenticated after logout), so sync code paths
      and templates see stale authentication state. Fixed by updating both `request.user` and `request.auser` when
      present.

  - culprit: 2ce5cb0f7a4618dfdc5f5c10e53e2e9b9543d298
    status: include
    fix_commit: a284a49153f005f2a7af087025e5112ba06cbd5f
    fix_tickets: [37047]
    bug_files: [django/db/models/sql/query.py]
    ground_truth: >
      The new `Query.orderby_issubset_groupby` property resolves every string in `order_by` with
      `F(order_by)`. Order-by strings may carry a "-" prefix for descending order or be "?" for random order, which
      are not field names. So e.g. `.values("is_staff").annotate(latest=Max(...)).order_by("-latest").count()`
      crashes with `FieldError: Cannot resolve keyword '-latest' into field`. Fixed by stripping the "-" prefix and
      returning False for "?".

  - culprit: 9b8e4c6d7d47f7b2e96817ba334e9fd53c10a0df
    status: include
    fix_commit: fabce94374e166e80e2643db8b85d1e3442427bf
    fix_tickets: [37377, 37403]
    bug_files: [django/db/models/fields/json.py]
    ground_truth: >
      For databases without a native JSON field, `JSONIn` now treats any `Value(...)` right-hand-side parameter as
      already JSON-serialized and uses `param.value` directly. That only holds for `Value(..., JSONField())`. A
      bare `Value("x")`, `Value(True)` or `Value(None)` has a non-JSON output field, so its raw primitive is passed
      where JSON text is expected. `__in` lookups with such values then crash (e.g. `Value(None)` on SQLite) or
      silently return wrong results. Fixed by JSON-encoding the Value's raw value when its output field is not a
      JSONField.

  - culprit: bdbda29c3e126754c3ae04ceb5c5d35d49aae01c
    status: include
    fix_commit: 93d7e82b6a67aa56a2d9dababfefb8bda543786e
    fix_tickets: [37382]
    bug_files: [django/db/transaction.py]
    ground_truth: >
      To avoid mutating the original view, `non_atomic_requests()` now wraps the view in a new synchronous
      `def wrapper(*args, **kwargs): return view(*args, **kwargs)`. For an async view this wrapper is a sync
      function returning a coroutine, so Django no longer recognizes the decorated view as async
      (`iscoroutinefunction` is False), and async views decorated with `@transaction.non_atomic_requests` break.
      Fixed by creating an `async def` wrapper when the view is a coroutine function.

  - culprit: 1a9fba7a6c2a0acead19bbb45c25ceb0fdcca7c8
    status: include
    fix_commit: 45fe4636d8d147b87040170a6cee4ab036ed2324
    fix_tickets: [37450]
    bug_files: [django/template/base.py]
    ground_truth: >
      The new lexer regexes for raw blocks require at least one whitespace character after `{%`:
      `_raw_start_re` uses `\s+` before comment/verbatim, and the end regexes use `[^\S\n]+` before
      endcomment/endverbatim. Django accepts tags written without spaces, e.g. `{%comment%}`, `{%verbatim%}` and
      `{%endverbatim%}`. Those are no longer recognized as raw-block delimiters, so their contents are tokenized and
      parsed as template code (wrong output or TemplateSyntaxError). Fixed by changing `+` to `*`.

  - culprit: f920937c8a63df6bea220e4386f59cdb45b2e355
    status: include
    fix_commit: 7bf3ac3ee255bcfe329e3203c7a2555b1275d506
    fix_tickets: [36796]
    bug_files: [django/urls/resolvers.py]
    ground_truth: >
      To skip the regex for converter-less routes, `RoutePattern.match()` now compares the path with
      `self._route` using string operations (`==`, `startswith`, `removeprefix`). `_route` can be a lazy
      translation object (`gettext_lazy()` routes, e.g. with i18n URL patterns). Lazy proxies don't behave like
      `str` for `str.startswith()` / `str.removeprefix()`, so such routes fail to match or raise. Fixed by coercing
      the route with `str(self._route)` at match time.

  - culprit: 0eec2a163a4b2ea4e82c53ae1d7b71bf43ac911d
    status: include
    fix_commit: 817df1c4d6d38f416460d7d9354d7deab9d35139
    fix_tickets: [37463]
    bug_files: [django/forms/boundfield.py]
    ground_truth: >
      Previously `label_tag()` built a fresh dict (`{**(attrs or {}), "for": ...}`) before adding the required CSS
      class. To omit "for" on <legend> tags, the commit uses `attrs = attrs or {}` and only copies when
      `tag != "legend"`. For legends (`legend_tag()`) the caller's own dict is kept, and the following
      `attrs["class"] += " " + required_css_class` mutates it in place. The caller's attrs dict is modified and the
      class accumulates on repeated rendering. Fixed by always copying attrs first.

  - culprit: 7142667340f78403cbbcaa8f33703c494282b7b7
    status: include
    fix_commit: a269574f1bcf4716502b9ba8c3492abf15dc93eb
    fix_tickets: [37405]
    bug_files: [django/core/serializers/pyyaml.py]
    ground_truth: >
      The commit replaces a custom dict representer with
      `yaml.dump(..., Dumper=DjangoSafeDumper, sort_keys=False, **self.options)`. If the caller passes `sort_keys`
      as a serializer option (e.g. `serializers.serialize("yaml", qs, sort_keys=True)`), the keyword is given
      twice and `yaml.dump()` raises `TypeError: got multiple values for keyword argument 'sort_keys'`. Fixed with
      `self.options.setdefault("sort_keys", False)`.

  - culprit: a9fe98d5bd4212d069afe8316101984aadecfbb2
    status: include
    fix_commit: 125b63ca745bace1e098ed3c7362d59136f68a8b
    fix_tickets: [36710]
    bug_files: [django/utils/html.py]
    ground_truth: >
      In `urlize`, the simple-URL regex for bare domains is changed to use `DomainNameValidator.hostname_re` before
      the TLD. `hostname_re` matches a single DNS label (no dots), so bare multi-label domains without `www.` or a
      scheme, e.g. `docs.djangoproject.com`, no longer match and are not turned into links (`djangoproject.com`
      still works). Fixed by appending `DomainNameValidator.domain_re`, which matches the additional dotted labels.

  - culprit: 78fac1b0473ed8960ecd2a30aca4fa8420d150b8
    status: include
    fix_commit: 356e5b0f5ddb473eec3ed96d8ad9a37f3f8585eb
    fix_tickets: [37184]
    bug_files: [django/contrib/auth/hashers.py]
    ground_truth: >
      To accept both str and bytes, the commit adds `password = force_str(password)` (and the same for salt) in
      `PBKDF2PasswordHasher.encode()` and `MD5PasswordHasher.encode()`. `force_str` decodes bytes as UTF-8, so a
      bytes password that is not valid UTF-8 (a perfectly valid password value) now raises `UnicodeDecodeError`
      instead of being hashed. Fixed by passing the password through unchanged in PBKDF2 (`pbkdf2()` accepts
      bytes) and hashing `force_bytes(salt) + force_bytes(password)` in MD5.

