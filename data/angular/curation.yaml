  # ---------------------------------------------------------------- scaleup-2026-11
  # Drafted by claude-opus-5-5 (`bench-eval draft`, data/DRAFTS.md) and checked by `bench-eval gtcheck`.
  # Author sign-off 2026-11-05: reviewed the judgment-call shortlist; dropped angular/bug-62083 (build
  # tooling), kept the rest. Labels themselves were model-checked (gtcheck), not expert-checked.
  - culprit_pr: 49144
    status: exclude
    batch: scaleup-2026-11
    notes: "The fix is a plain revert citing only 'a number of regressions', so the drafted mechanism is a reconstruction (gtcheck: minor). Reverts are a poor label source."
    fix_commit: cb31dbc75ca4141d61cec3ba6e60505198208a0a
    issue: 50457
    bug_files: [packages/zone.js/lib/node/promise.ts, packages/zone.js/lib/node/rollup-main-node-bundle.ts, packages/zone.js/bundles.bzl]
    ground_truth: >
      The new `lib/node/promise.ts`, now used as the `zone-node` entry point, replaces ZoneAwarePromise with a
      patch of `Promise.prototype.then` only. Its `makeResolver` wraps every onResolve/onReject callback in
      `zone.runGuarded(() => task.invoke())`. `runGuarded` catches exceptions and passes them to the zone's
      `onHandleError`. When that hook returns false, as Angular's NgZone does, the exception is swallowed and the
      wrapper returns `undefined` to the native `then`. So inside NgZone, `p.then(() => { throw err;
      }).catch(handler)` never reaches `handler`; the chained promise resolves with `undefined` instead of
      rejecting, breaking error propagation (e.g. in SSR). In addition, native `await` and other engine-internal
      promise reactions bypass the patched `then`, so they no longer take part in zone tracking the way they did
      with ZoneAwarePromise. The fix reverted the change and went back to patching the whole Promise
      (ZoneAwarePromise) in the `zone-node` bundle.
  - culprit_pr: 56852
    status: include
    batch: scaleup-2026-11
    fix_commit: 36c2197539f7275a8688a073161435f56d880b9a
    issue: 70044
    bug_files: [packages/zone.js/lib/common/timers.ts]
    diff_range_from_case: ctl-56852  # former control, not in candidates.jsonl
    ground_truth: >
      In `patchTimer`'s `scheduleTask`, the change stores the native timer's return value in `handleOrId`. When it
      is not a number, it executes `data.isRefreshable = isFunction(handleOrId.refresh)`. Some environments return
      null or undefined from `setTimeout`/`setInterval`/`requestAnimationFrame`, for example a browser extension,
      policy or automation wrapper that blocks the call. The old code explicitly tolerated a nullish handle. With
      this change, reading `.refresh` on null throws a TypeError synchronously, so calling the patched
      `setTimeout` crashes instead of returning. The fix uses optional chaining (`handleOrId?.refresh`) so a
      nullish handle is treated as non-refreshable.
  - culprit_pr: 57796
    status: include
    batch: scaleup-2026-11
    fix_commit: 549a00d18b9060b7bae35a715e233021ef34a39a
    issue: 58399
    bug_files: [packages/compiler/src/shadow_css.ts]
    ground_truth: >
      In `ShadowCss._scopeSelector`/`_applySelectorScope`, the change replaced the simple `/ ?, ?/` comma split
      and the combinator separator with regexes that do not split inside parentheses. A selector part like
      `.foo:is(.a,\n.b)` therefore now reaches `_scopeSelectorPart` as a single string that can contain newlines.
      That function splits the part with `/([^:]*)(:*)(.*)/`, both in the newly added pseudo-function `:host`
      branch (`scopedP.match(...)`) and in the non-host branch (`t.match(...)`). Because `.` does not match a
      newline, everything after the first newline is silently dropped. For example, a component style
      `.foo:is(.a,\n.b) {}` is emitted as `.foo[contenta]:is(.a,`, with the rest of the selector and the closing
      parenthesis lost, which breaks the stylesheet. The fix changed the trailing group of both regexes to
      `([\s\S]*)` so content after newlines is kept.
  - culprit_pr: 60206
    status: include
    batch: scaleup-2026-11
    fix_commit: 7f85d184b04530aad90f1465b5eb9b47abcc1b2b
    bug_files: [devtools/projects/ng-devtools-backend/src/lib/component-tree.ts]
    ground_truth: >
      In `getLatestComponentState` (component-tree.ts), the change wraps `metadata.dependencies =
      getDependenciesForDirective(...)` in `if (injector)`. Previously `dependencies` was always assigned on the
      directive metadata. Now `getInjectorFromElementNode` returns null whenever `ng.getInjector` is not supported
      (or returns nothing), and in that case `dependencies` is left `undefined`. The DevTools property view
      template evaluates `controller().directiveMetadata?.dependencies.length > 0`. The optional chain only guards
      `directiveMetadata`, not `dependencies`. So when an app's global `ng` lacks `getInjector`, selecting a
      component throws a TypeError reading `length` of undefined and the property panel breaks. The fix guards the
      template by first checking that `dependencies` exists before reading its `length`.
  - culprit_pr: 61241
    status: include
    batch: scaleup-2026-11
    fix_commit: be2747eb262adb4b10501a37538baf3e1458b56b
    bug_files: [devtools/projects/ng-devtools/src/lib/devtools-tabs/injector-tree/injector-tree.component.ts, devtools/projects/ng-devtools/src/lib/devtools-tabs/devtools-tabs.component.html]
    ground_truth: >
      This change rewrites `InjectorTreeComponent` to render from an `afterRenderEffect` that runs whenever the
      `componentExplorerView` input changes. The effect calls `init()` and
      `updateInjectorTreeVisualization(view.forest)` without checking whether the tab is visible. The change also
      hides the deferred `ng-injector-tree` with `[hidden]` (display:none) and removes the old `ng-injector-
      tree.hidden` CSS, which had kept the element laid out with `visibility: hidden`. So once the Injector Tree
      tab has been opened and the user switches to another tab, every new component explorer view re-runs the
      effect. D3 then tries to lay out, translate and snap SVG trees inside an element with no layout, which
      throws errors. `init()` also runs on every effect execution, re-registering the `highlightComponent`
      listener and recreating the visualizers each time. The fix adds a `hidden` input bound to the host's
      `[hidden]`, returns early from the effect when it is true (read untracked), and calls `init()` only once,
      when the visualizers do not exist yet.
  - culprit_pr: 62083
    status: exclude
    batch: scaleup-2026-11
    decision: "2026-11-05 author: drop; Bazel build-config change (build tooling under the inclusion rule)"
    fix_commit: 29223931da94f92366cdab4f923fc2e7dfb87956
    bug_files: [devtools/src/BUILD.bazel, devtools/projects/shell-browser/src/BUILD.bazel]
    ground_truth: >
      The change switches the zone.js dependency in `devtools/src/BUILD.bazel` (the `devapp` pkg_web) and
      `devtools/projects/shell-browser/src/BUILD.bazel` (the static files filegroup). It goes from
      `@npm//:node_modules/zone.js/bundles/zone.umd.min.js` to the workspace target `//:node_modules/zone.js`.
      That moves the packaged file from `./npm/node_modules/zone.js/...` to `./node_modules/zone.js/...`. The
      change updated the `<script>` tag only in `demo-standalone/src/index.html`. `devtools/src/index.html` and
      `devtools/projects/shell-browser/src/index.html` still reference
      `./npm/node_modules/zone.js/bundles/zone.umd.min.js`. In both the DevTools dev app and the production
      browser-extension build, that script 404s and zone.js is never loaded, so the zone-based Angular app fails
      to bootstrap or run correctly. The fix updated both index.html files to load
      `./node_modules/zone.js/bundles/zone.umd.min.js`.

