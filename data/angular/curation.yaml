# Hand-verified bug cases. One entry per culprit PR from data/candidates.jsonl.
#
# Inclusion rule: a later fix commit/PR (or a maintainer comment on an issue that a fix then closed)
# explicitly attributes the bug to this PR, AND the faulty code is visibly present in this PR's diff,
# AND the bug is a behavioral defect (not a style, docs, build-config or internal-only CI breakage).
# Ground truth is written from the fix commit/PR and its diff, describing what goes wrong and where.
#
# status: include | exclude | backup
# Ground truths below were drafted by Claude Code from the cited fix diffs; pending author confirmation.

bugs:
  - culprit_pr: 60875
    status: include
    fix_pr: 66201
    fix_commit: bcef77d9507e9778c35a6186ef4a8c1d67cd5992
    bug_files: [packages/router/src/directives/router_link.ts]
    ground_truth: >
      RouterLink on anchor elements now only subscribes to router NavigationEnd events (to recompute `href`)
      when `subscribeToNavigationEventsIfNecessary` decides the link depends on router state, i.e. only for
      `preserveFragment` or `queryParamsHandling` 'merge'/'preserve' (plus a clause about the router's default
      handling). But the href of a relative link also changes whenever navigation changes the ActivatedRoute it
      resolves against. E.g. `<a [routerLink]="['./child']" queryParamsHandling="replace">` keeps showing
      `/initial/child` after navigating to `/different`. The optimization's premise is wrong, so hrefs go stale
      after navigation. The fix removes the condition and always subscribes for anchor elements (effectively
      rolling back the PR). A finding that only says the default-handling clause is inverted, and implies
      subscribing in fewer cases, is a different defect: its fix would remove subscriptions that relative links
      need, the opposite of the real fix.
    decision: "2026-11-04 author: inverted default-handling clause alone does not count (priority_review.md #1)"

  - culprit_pr: 63485
    status: include
    fix_pr: 63546
    fix_commit: 4c36659ba982d5d26ced14d3854cbd16703f6c01
    bug_files: [packages/router/src/recognize.ts]
    ground_truth: >
      The PR replaces `.toPromise()` with a custom `firstValueFrom` (built on rxjs `first()`) in route
      recognition (`matchWithChecks`, `runCanLoadGuards`, `loadChildren`). Unlike `toPromise()`, which resolves
      `undefined` when an observable completes without emitting, `first()` errors with an EmptyError. Guards or
      matchers whose observables complete without emitting now throw EmptyError instead of being treated as
      "no match"; the recognizer's catch only skips NoMatch errors, so navigation fails instead of moving on to
      the next route. Fixed by also treating EmptyError as a non-match in recognize.ts.
    decision: "2026-11-04 author: a finding on the new first_value_from.ts helper that names the first()/EmptyError mechanism counts (priority_review.md #2)"

  - culprit_pr: 50063
    status: include
    fix_pr: 51394
    fix_commit: a9b3c006f8593e0187298df21418644070312a40
    issue: 51382
    bug_files: [packages/core/testing/src/test_hooks.ts]
    ground_truth: >
      While replacing `global` with `globalThis`, the PR removed the guards around the Jasmine/Jest hooks in
      `@angular/core/testing` test_hooks.ts: `if (_global.beforeEach) {...}` became an unconditional
      `beforeEach(...)` / `afterEach(...)`. When this module is evaluated outside a test runner (e.g. it ends up
      in an application bundle), `beforeEach` is undefined and loading the module throws a ReferenceError.
      Fixed by calling `globalThis.beforeEach?.(...)` / `globalThis.afterEach?.(...)`.

  - culprit_pr: 69309
    status: include
    fix_pr: 70105
    fix_commit: 03f1758e2ae7e033c14360a72583d51825993217
    issue: 70104
    bug_files: [devtools/projects/shell-browser/src/app/chrome-application-operations.ts]
    ground_truth: >
      To escape code injected into the inspected page, the PR changes `findConstructorByPosition('${position}')`
      and `findDomElementByPosition('${position}')` to pass `stringifyAndEscape(position)`. `position` is an
      array, so it used to be serialized implicitly as a comma-separated string ("0,1,2"); now it is passed as a
      JSON array string ("[0,1,2]"). The backend that parses this serialized id still expects the
      comma-separated format, so "view source" and "select DOM element" from the component tree break. The fix
      updates the backend (component-tree.ts) to the new format; the PR changed the wire format without
      updating its consumer.

  - culprit_pr: 67032
    status: include
    fix_commit: 6b5616b2c7745ff4777f8d2ea038ebd297aeeb38
    issue: 69291
    bug_files: [packages/core/src/animation/utils.ts, packages/core/src/render3/node_manipulation.ts]
    ground_truth: >
      `cancelLeavingNodes` now force-removes any element tracked as leaving for the same TNode whenever it sits in
      a different DOM parent than the newly inserted element (added to de-duplicate dynamic components
      re-rendered into a fresh overlay pane). `leavingNodes` is keyed by TNode, which is shared by every instance
      of a template, so distinct sibling instances (e.g. an accordion where opening section B collapses section A
      in another parent) are also "different parent": the still-animating element is removed synchronously and
      its `animate.leave` animation is skipped. Fixed by tracking the declaration view of each leaving element
      and only doing the cross-parent removal for the same logical view.

  - culprit_pr: 48558
    status: include
    fix_pr: 49118
    fix_commit: 0198d21231565f5eeaa27a871b9bb9e950b4a869
    issue: 49100
    bug_files: [packages/compiler/src/shadow_css.ts]
    ground_truth: >
      To avoid treating the space in an escaped selector (".\fc ber") as a combinator, the PR skips a separator
      when the preceding part matches `_placeholderRe` (`__ph-N__`) and the next character is a hex digit. But
      SafeSelector uses the same `__ph-N__` placeholder for attribute selectors and other content, not only for
      escape sequences. In minified CSS without spaces, e.g. `:host[foo]>div`, the `>` separator is skipped
      because the part contains an attribute placeholder and the next char 'd' is hex, so the selector is scoped
      incorrectly and styles on :host attributes break in production builds. Fixed by giving escapes their own
      `__esc-ph-N__` placeholder and checking only for that.

  - culprit_pr: 48063
    status: include
    fix_pr: 49572
    fix_commit: fa3909e8b4b982423357a6e3d6c1d719ea6fa378
    issue: 49567
    bug_files: [packages/router/src/provide_router.ts]
    ground_truth: >
      In the bootstrap listener the PR replaces `bootstrapDone.next(); bootstrapDone.complete();` with
      `if (!bootstrapDone.closed) { bootstrapDone.next(); bootstrapDone.unsubscribe(); }`. `unsubscribe()` on a
      Subject does not complete it, so the initial navigation (with `initialNavigation: 'enabledBlocking'`),
      which waits on `bootstrapDone`, never completes and its `finalize` never clears the router's current
      navigation; later navigations (e.g. re-navigating from a component's init) misbehave. Fixed by completing
      the subject again and taking only one emission in the navigation transition.

  - culprit_pr: 46096
    status: include
    fix_pr: 46807
    fix_commit: 93d17ee888fc14c740daad5c74f17f0863cddddd
    issue: 46747
    bug_files: [packages/compiler-cli/src/ngtsc/typecheck/src/tcb_util.ts, packages/compiler-cli/src/ngtsc/typecheck/src/context.ts]
    ground_truth: >
      `requiresInlineTypeCheckBlock` now requires an inline type-check block whenever any pipe in its `usedPipes`
      argument cannot be referenced from the TCB environment (`env.canReferenceType`, stricter than the previous
      "is exported" check). But the caller in context.ts passes `pipes`, the map of all pipes in the component's
      scope, not just those used in the template. Components that merely have an unreferenceable pipe in scope
      are now forced to inline, which errors where inlining is unsupported (e.g. the language service reports
      spurious errors). Fixed by passing only the pipes the template actually uses.
    decision: "2026-11-04 author: keep; tagged needs-file-context, since `pipes` is declared outside the diff (priority_review.md #5)"

  - culprit_pr: 53695
    status: include
    fix_pr: 54495
    fix_commit: 0c8744c73e3d8d68463f726c41b134223dc324b1
    issue: 54491
    bug_files: [packages/compiler-cli/src/ngtsc/annotations/component/src/handler.ts]
    ground_truth: >
      The PR adds support for default imports in `@defer` dependencies and records `isDefaultImport` in the
      `deferrableTypes` map, but never sets `deferBlockDep.isDefaultImport` on the per-block dependency objects
      (they keep the initial `isDefaultImport: false`). The generated dependency loader function for the defer
      block reads that flag, so for a default-imported component it emits `m.ComponentName` instead of
      `m.default`, and loading the deferred block yields undefined. Fixed by setting
      `deferBlockDep.isDefaultImport = isDefaultImport(importDecl)` in `collectDeferredSymbols`.

  - culprit_pr: 55796
    status: include
    fix_pr: 70432
    fix_commit: 4c4a705ce38d08e087b599fc243a9d7dc40966a5
    issue: 70431
    bug_files: [packages/zone.js/lib/common/events.ts]
    ground_truth: >
      To avoid mutating readonly/frozen listener options, the PR copies them with `{...options}` in
      `copyEventListenerOptions` before passing them to the native `addEventListener` (special-casing only
      `signal`). Object spread copies only own enumerable data properties, while the native call reads each option
      via [[Get]]. Options supplied as getters, on the prototype, or as non-enumerable properties are silently
      dropped: `capture: true` becomes bubbling, `once: true` fires repeatedly, and the MDN `passive`
      feature-detection getter is never invoked. Fixed by also reading `capture`, `once`, `passive` and `signal`
      from the source object when the spread did not copy them.

